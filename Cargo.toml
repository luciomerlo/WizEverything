[package]
name = "wizeverything"
version = "0.14.0"
edition = "2024"
license = "MIT"
description = "WizTree-style disk space visualizer that reads Everything's index"
repository = "https://github.com/luciomerlo/WizEverything"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui_extras = "0.37.0"
raw-window-handle = "0.6.2"
serde_json = "1.0.154"
tray-icon = "0.26.1"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_Security", "Win32_Globalization", "Win32_UI_Controls_Dialogs", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_Security_Cryptography", "Win32_Graphics_Dwm", "Win32_System_IO", "Win32_System_Ioctl"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
blake3 = "1"
zstd = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
lofty = "0.22"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4", "alac"] }
rustfft = "6"
cpal = "0.15"
kamadak-exif = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

