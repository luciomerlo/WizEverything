[package]
name = "wizeverything"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "WizTree-style disk space visualizer that reads Everything's index"
repository = "https://github.com/luciomerlo/WizEverything"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.37.0"
raw-window-handle = "0.6.2"
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_Security", "Win32_Globalization", "Win32_UI_Controls_Dialogs", "Win32_System_SystemInformation", "Win32_UI_Controls"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

