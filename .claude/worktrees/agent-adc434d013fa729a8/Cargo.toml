[package]
name = "wizeverything"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "WizTree-style disk space visualizer that reads Everything's index"
repository = "https://github.com/luciomerlo/WizEverything"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui_extras = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "gif", "webp", "tiff"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
lofty = { version = "0.25.5", default-features = false }
raw-window-handle = "0.6.2"
serde_json = "1.0.154"
tray-icon = "0.26.1"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_Security", "Win32_Globalization", "Win32_UI_Controls_Dialogs", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_Security_Cryptography", "Win32_Graphics_Dwm"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
jpeg-encoder = "0.7.1"

